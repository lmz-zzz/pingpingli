<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评评理 · 注册登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 页面：注册 / 登录
     后端：POST /api/register {email, code, nickname}；POST /api/login
     演示：验证码显示在 data-bind="demo-code" 里 -->

<main class="page">
  <div class="auth">
    <a class="logo" href="index.html">评评<span style="color:var(--accent)">理</span> 🍉</a>
    <p class="muted" style="text-align:center">室友之间那点小事，来让大家评评理</p>
    <form class="card" id="register-form" action="index.html">
      <div class="seg"><a class="on" href="#">注册</a><a href="#">登录</a></div>
      <label>学校邮箱</label>
      <div class="row"><input type="text" name="email" value="2023xxxx@ruc.edu.cn" style="flex:1"><a class="btn" href="#" id="send-code">发验证码</a></div>
      <p class="hint">只有本校同学能注册，来评理的都是同学。</p>
      <label>验证码</label>
      <input type="text" name="code" value="482913">
      <p class="demo-note" data-bind="demo-code">演示版：验证码直接显示在这里 482913</p>
      <label>昵称</label>
      <input type="text" name="nickname" value="今天也想睡个好觉">
      <p class="hint">案子里一律显示为“室友 A / 室友 B”，不会出现昵称和真名。</p>
      <label class="check"><input type="checkbox" checked><span>我同意《评评理公约》：只评事，不评人；不晒真名、不晒宿舍号</span></label>
      <button class="btn primary block" type="submit">进来吃瓜</button>
    </form>
  </div>
</main>


<script src="app.js"></script>
</body>
</html>
