<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评评理 · 我要评理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 页面：立案 + 室友应诉
     后端：POST /api/cases {category, title, claimA, chat}，返回 id；应诉状态读 case.respondent.agreed / case.claimB -->
<header class="topbar"><div class="inner">
  <a class="logo" href="index.html">评评<span>理</span> 🍉</a>
  <nav class="nav">
    <a href="index.html">吃瓜广场</a>
    <a class="on" href="file.html">我要评理</a>
    <a href="hall.html">陪审员中心</a>
    <a href="me.html">我的</a>
  </nav>
</div></header>

<main class="page">
  <div class="steps"><div class="on">立案</div><div>室友应诉</div><div>大家评理</div><div>判决</div></div>
  <div class="grid2">
    <form class="card" id="case-form" action="case.html">
      <h1>我要评理</h1>
      <p class="muted">和室友有点小分歧？写下来，让大家帮你们看看。</p>
      <label>是关于什么的</label>
      <div class="chips">
        <label><input type="radio" name="category" value="空调" checked>空调</label>
        <label><input type="radio" name="category" value="作息">作息</label>
        <label><input type="radio" name="category" value="卫生">卫生</label>
        <label><input type="radio" name="category" value="外卖">外卖</label>
        <label><input type="radio" name="category" value="借东西">借东西</label>
        <label><input type="radio" name="category" value="其他">其他</label>
      </div>
      <label>一句话标题</label>
      <input type="text" name="title" value="空调该开 22°C 还是 28°C？">
      <label>我的说法</label>
      <textarea name="claimA">我特别怕热，晚上 28°C 根本睡不着，第二天早八起不来。我想开 22°C。</textarea>
      <label>寝室群聊天记录（可选）</label>
      <textarea name="chat" style="min-height:90px" placeholder="直接复制粘贴寝室群的聊天">[22:41] A：今晚能开低一点吗，热得睡不着
[22:43] B：我已经盖了两床被子了……
[23:10] A：（默默调到 24）
[23:12] B：（默默调回 27）</textarea>
      <p class="hint">真名、宿舍号会自动隐去，你们俩在案子里叫“室友 A”和“室友 B”。</p>
      <button class="btn primary block" style="margin-top:16px" type="submit">生成邀请链接，发给室友</button>
    </form>
    <aside>
      <div class="card" data-bind="respond-status">
        <h3>室友应诉</h3>
        <p class="muted">室友同意了才会开庭，Ta 也会写下自己的说法。</p>
        <div class="stat"><span><span class="who B">B</span> 室友 B</span><span>✅ 已同意</span></div>
        <p class="quote" data-bind="claimB">“我怕冷，22°C 我得盖两床被子，上个月还感冒了一次。”</p>
        <p class="demo-note">演示用：<a href="case.html"><u>模拟室友同意 → 开庭</u></a></p>
      </div>
      <div class="card">
        <h3>室友收到的邀请</h3>
        <p class="muted">“你的室友想请大家评评‘空调该开几度’。不是告状，是一起找个办法。你愿意写下你的说法吗？”</p>
        <a class="btn" href="#">愿意，写我的说法</a>
      </div>
    </aside>
  </div>
</main>

<nav class="tabbar">
  <a href="index.html"><b>🍉</b>广场</a>
  <a class="on" href="file.html"><b>📝</b>立案</a>
  <a href="hall.html"><b>⚖️</b>陪审</a>
  <a href="me.html"><b>🏠</b>我的</a>
</nav>

<script src="app.js"></script>
</body>
</html>
